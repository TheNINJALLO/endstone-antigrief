[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-antigrief"
version = "1.3.1"
description = "Player behavior logging, querying, anti-spam, banning, and WebUI dashboard for Endstone Minecraft Bedrock servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "TheN1NJ4LL0", email = "joaldrichsh@gmail.com" }
]
keywords = ["endstone", "plugin", "antigrief", "logging", "behavior", "webui", "admin"]

dependencies = [
    "endstone",
    "requests",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "bedrock-protocol-packets",
]


[project.entry-points.endstone]
antigrief = "endstone_antigrief:AntiGriefPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_antigrief"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]
