name: Verify SDK compatibility and publish release

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the supported SDK and test dependencies
        run: |
          python -m pip install endstone==0.11.16 build pytest httpx httpx2
          python -m pip install .
      - name: Run existing regression tests
        run: |
          if [[ -f run_tests.py ]]; then
            python run_tests.py
          elif [[ -d tests ]]; then
            python -m pytest -q tests
          fi
      - name: Build release artifacts
        run: |
          python -m build --wheel
      - name: Verify built entry points with the real SDK
        run: python "$GITHUB_WORKSPACE/.github/scripts/verify_release.py"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.zip
            dist/*artifacts.json
          if-no-files-found: error
      - name: Publish the verified compatibility release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its artifacts."
            exit 0
          fi
          notes="$GITHUB_WORKSPACE/.github/release-notes/$tag.md"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.zip' -o -name '*artifacts.json' \) -print0 | xargs -0 gh release upload "$tag"
          gh release edit "$tag" --draft=false --latest
