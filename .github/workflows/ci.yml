name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff build httpx2
      - run: python -m pytest
      - run: ruff check src tests
      - run: python -m build
      - run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: endstone-antigrief-dist
          path: dist/*
