name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.5.13"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff build
      - run: python -m pytest
      - run: ruff check src tests
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Verify version
        run: |
          python - <<'PY'
          import pathlib, re, os
          expected = os.environ['EXPECTED']
          text = pathlib.Path('pyproject.toml').read_text()
          actual = re.search(r'(?m)^version = "([^"]+)"', text).group(1)
          assert actual == expected, f'pyproject version {actual} does not match tag {expected}'
          PY
        env:
          EXPECTED: ${{ steps.tag.outputs.version }}
      - run: python -m build
      - run: python scripts/verify_release.py
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
